nformation Systems\" style=\"height: 300px; width: auto; flex-shrink: 0\">\n<div style=\"display: flex; flex-direction: column; gap: 22px; flex: 1; min-width: 0\">\n<div style=\"font-size: 32px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #8B6B12\">MSc in Information Systems · Capstone Project · Data Science &amp; Data Analytics<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 150px; line-height: 1.02; font-weight: 700; color: #13235B; letter-spacing: -2px\">From Forum Posts to Telco Actions<\u002Fh1>\n<div style=\"font-size: 54px; line-height: 1.25; color: #2A3042; text-wrap: balance\">An end-to-end pipeline for sentiment and issue analysis of Singapore telecommunications discussions, with LLMs tested against blind human labels<\u002Fdiv>\n<div style=\"font-size: 36px; color: #2A3042\"><b style=\"color: #13235B\">Liao Zixin<\u002Fb>   ·   Supervisor: Kyong Jin SHIM   ·   School of Computing and Information Systems, Singapore Management University   ·   October 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- KEY NUMBERS -->\n<section aria-label=\"Key numbers\" style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: #13235B; color: #FFFFFF; border-radius: 20px; padding: 48px 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">9,162<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">unique posts in 349 telco threads (Reddit + HardwareZone, to 26 Sep 2026)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">44%<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">of posts are not happy (GPT-4o-mini); VADER calls 46% happy<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">0.641 <span style=\"font-size: 52px; color: #B9C2E0\">vs 0.380<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">sentiment macro F1, GPT-4o-mini vs VADER on 392 blind human labels<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">0.639 <span style=\"font-size: 52px; color: #B9C2E0\">vs 0.590<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">issue macro F1, rules + GPT-4o on unresolved posts vs rules alone<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">$6.35<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">total OpenAI billing, 1 Sep–22 Oct 2026: $5.34 for reported results, $1.01 for a discarded run and tests<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- BODY: three columns -->\n<div style=\"flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 100px\">\n\n<!-- COLUMN 1 -->\n<div style=\"display: flex; flex-direction: column; gap: 40px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>01<\u002Fspan>Why forums, and what we asked<\u002Fh2>\n<p class=\"p\">Singapore mobile customers argue about coverage, plan terms, outages and support on Reddit and HardwareZone (HWZ) every day. The feedback is early but informal, Singlish-heavy and repetitive: too much to read by hand, and often misread by a sentiment lexicon.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ1<\u002Fb><p class=\"p\">Which sentiment and issue themes appear most frequently in the collected Singapore telco discussions?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ2<\u002Fb><p class=\"p\">How do discussion patterns differ between Reddit and HWZ, and across telco brands?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ3<\u002Fb><p class=\"p\">What do GPT-4o-mini and GPT-4o add over VADER sentiment and keyword-based issue rules?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ4<\u002Fb><p class=\"p\">How can the extracted signals support concrete decisions by telco operators?<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>02<\u002Fspan>Data: most rows were duplicates<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; gap: 24px; background: #E9ECF4; border-radius: 14px; padding: 20px 28px; width: 100%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; color: #13235B; width: 230px; flex-shrink: 0\">24,690<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">scraped rows after preprocessing<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px; background: #D3D9EA; border-radius: 14px; padding: 20px 28px; width: 86%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; color: #13235B; width: 230px; flex-shrink: 0\">11,643<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">unique posts (repeat scrape rounds re-saved the same comments)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px; background: #13235B; color: #FFFFFF; border-radius: 14px; padding: 20px 28px; width: 72%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; width: 230px; flex-shrink: 0\">9,162<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">posts in 349 telco threads; 96 off-topic threads dropped<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">5,711 Reddit and 3,451 HWZ posts; Reddit after 9 Apr 2026 from the Arctic Shift archive. Shares are reported per post and thread-weighted.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>03<\u002Fspan>Pipeline<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">1<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Collect<\u002Fb> · Reddit and HWZ (XenForo) scrapers, brand-keyword matched<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">2<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Preprocess<\u002Fb> · one schema; drop empty, placeholder and short rows<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">3<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Brand detection<\u002Fb> · regex for Singtel, StarHub, M1, SIMBA, Giga, Eight, Zym, redONE; ambiguous names need a telco word nearby<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">4<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #13235B; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Sentiment<\u002Fb> · GPT-4o-mini, temperature 0, JSON, batches of 10 (VADER kept as baseline)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">5<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #13235B; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Issues<\u002Fb> · keyword taxonomy first; GPT-4o only on rows rules left as general discussion<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">6<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Clean corpus<\u002Fb> · dedupe by post ID; keep threads where ≥20% of posts name a telco<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: {{accent}}; color: #13235B; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">7<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Dashboard<\u002Fb> · static HTML page with a weekly huddle queue<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-left: 88px; border: 3px dashed #8B6B12; border-radius: 14px; padding: 16px 24px; font-size: 28px; line-height: 1.35; color: #3A3220; background: #FBF6E8\">Evaluation branch: blind human gold labels score steps 4 and 5. They check the labels and never feed back into the data.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fdiv>\n\n<!-- COLUMN 2 -->\n<div style=\"display: flex; flex-direction: column; gap: 44px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>04<\u002Fspan>Evaluation design<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 80px; font-weight: 700; color: #13235B; line-height: 1\">392<\u002Fdiv>\n<div style=\"font-size: 29px; line-height: 1.3\"><b>Representative set.<\u002Fb> Telco posts across the whole period; carries the headline metrics.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 80px; font-weight: 700; color: #13235B; line-height: 1\">100<\u002Fdiv>\n<div style=\"font-size: 29px; line-height: 1.3\"><b>Challenge set.<\u002Fb> Held-out hard posts: sarcasm, Singlish, negation, mixed brands.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">Annotators saw only the thread title and post, never a model output. Paired bootstrap (2,000 resamples) separates real gains from ties.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Sentiment macro F1<\u002Fh3>\n<div style=\"display: flex; gap: 36px; font-size: 26px; color: #4A5163; align-items: center\">\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 44px; height: 26px; background: #13235B; display: inline-block\"><\u002Fspan>Representative (n=392)<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 44px; height: 26px; border: 4px solid #13235B; box-sizing: border-box; display: inline-block\"><\u002Fspan>Challenge (n=100)<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">VADER<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 38%; height: 42px; background: #8A92A6; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.380<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.1%; height: 42px; border: 4px solid #8A92A6; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.491<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 61.1%; height: 42px; background: #5B78C7; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.611<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 71.2%; height: 42px; border: 4px solid #5B78C7; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.712<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 800; color: #13235B\">GPT-4o-mini<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 64.1%; height: 42px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.641<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 77.3%; height: 42px; border: 4px solid #13235B; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.773<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">GPT-4o-mini beats VADER by <b>+0.261<\u002Fb> (95% CI 0.197 to 0.324) and ties GPT-4o at about 1/17 of the cost. VADER labels 74 of 186 human complaints as happy. A rerun reproduced 292 of 295 labels (κ 0.98).<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Issue macro F1<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o-mini<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.8%; height: 42px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.498<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 47%; height: 42px; border: 4px solid #13235B; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.470<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">Keyword rules<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 59%; height: 42px; background: #8A92A6; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.590<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.9%; height: 42px; border: 4px solid #8A92A6; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.499<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o, all posts<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 58.5%; height: 42px; background: #5B78C7; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.585<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 59.6%; height: 42px; border: 4px solid #5B78C7; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.596<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 800; color: #13235B\">Hybrid: rules, then GPT-4o<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 63.9%; height: 42px; background: {{accent}}; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.639<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 50.9%; height: 42px; border: 4px solid {{accent}}; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.509<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">On typical posts the hybrid is the only method that beats rules (<b>+0.049<\u002Fb>, CI 0.024 to 0.074): it keeps rule hits such as Devices (GPT-4o finds 24% of device posts, rules 81%). On hard posts its gain vanishes and GPT-4o on every post wins. No issue method wins on both sets.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Human agreement sets the ceiling<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; font-size: 29px\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 3px solid #13235B; font-weight: 700; color: #13235B\"><span>Cohen's κ, sentiment<\u002Fspan><span style=\"text-align: right\">Typical<\u002Fspan><span style=\"text-align: right\">Hard<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>Annotator A vs B<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.37<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.59<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>A vs B, one disputed rule removed<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.57<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.86<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>GPT-4o-mini vs A<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.33<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.66<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>GPT-4o-mini vs B<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.52<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.54<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">Most disagreement is one question: is a bare failure report a complaint or neutral? The model agrees with each human about as well as they agree with each other.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n<!-- COLUMN 3 -->\n<div style=\"display: flex; flex-direction: column; gap: 44px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>05<\u002Fspan>Findings: two in five posts are unhappy<\u002Fh2>\n<div style=\"display: flex; gap: 32px; font-size: 26px; color: #4A5163; align-items: center\">\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #B4501A; display: inline-block\"><\u002Fspan>Not happy<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #D5D9E2; display: inline-block\"><\u002Fspan>Neutral<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #2F5BB7; display: inline-block\"><\u002Fspan>Happy<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 700; color: #13235B\">GPT-4o-mini, per post<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 44 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">44%<\u002Fdiv><div style=\"flex: 37 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">37%<\u002Fdiv><div style=\"flex: 19 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">19%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">GPT-4o-mini, thread-weighted<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 42 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">42%<\u002Fdiv><div style=\"flex: 40 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">40%<\u002Fdiv><div style=\"flex: 18 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">18%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">Human gold labels<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 47 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">47%<\u002Fdiv><div style=\"flex: 32 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">32%<\u002Fdiv><div style=\"flex: 21 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">21%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">VADER, same posts<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 28 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">28%<\u002Fdiv><div style=\"flex: 27 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">27%<\u002Fdiv><div style=\"flex: 46 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">46%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">VADER nearly reverses the picture. These are shares of unsolicited forum talk, not a satisfaction rate.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Issue share of posts (hybrid labels)<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 28px\">\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0; font-weight: 700; color: #13235B\">Network Quality<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 74%; height: 40px; background: {{accent}}; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-weight: 800\">40.7%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">General Discussion<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 26.5%; height: 40px; background: #A9B0C2; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">14.6%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Mobile Plans<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 25.1%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">13.8%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Pricing &amp; Promotions<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 14.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">8.1%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Devices<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 10.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">5.9%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Customer Service<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%  ·  59% not happy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">App &amp; Account<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%  ·  in 115 threads<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Roaming<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Billing &amp; Payment<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 5.3%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">2.9%  ·  53% not happy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Porting<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 5.3%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">2.9%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">Network quality carries 46% of thread-weighted not-happy discussion. GPT-4o cut general discussion from 35% to 15% of posts.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Case study: one outage skews everything<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n<div style=\"background: #FBEDE5; border-radius: 16px; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 76px; font-weight: 700; color: #8F3C10; line-height: 1\">71% <span style=\"font-size: 40px; color: #4A5163\">vs 40%<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 28px; line-height: 1.3\">not happy inside the 45 outage threads (12% of posts) vs all others<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 76px; font-weight: 700; color: #13235B; line-height: 1\">1,099<span style=\"font-size: 40px; color: #4A5163\">/1,102<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 28px; line-height: 1.3\">outage posts are on Reddit, so the Reddit–HWZ gap shrinks from 48/37% to 42/37%<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">Led by the 16 March 2026 Singtel outage. Outside outage threads, Singtel, StarHub, SIMBA, M1 and Giga sit at 40–43% not happy; Eight is lowest (31–35%) under every weighting. No brand league table is defensible.<\u002Fp>\n<p class=\"p\">The weekly huddle alert (2× the 26-week median, 115 posts) fired twice: the Singtel outage week (352) and 14 Sep 2026 (149), a multi-brand week of StarHub broadband and SIMBA app OTP failures.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TAXONOMY + RECOMMENDATIONS -->\n<div style=\"display: flex; flex-direction: column; gap: 32px; background: #F3F4F8; border-radius: 20px; padding: 40px 52px\">\n<section aria-label=\"Issue taxonomy\" style=\"display: flex; align-items: center; gap: 48px; padding-bottom: 32px; border-bottom: 3px solid #C3CADB\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; width: 620px; flex-shrink: 0\">\n<h2 class=\"sh\" style=\"border-bottom: none; padding-bottom: 0\"><span>06<\u002Fspan>Issue taxonomy<\u002Fh2>\n<p class=\"cap\">Ten labels, multi-label per post; each routes to an owning team.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px\">\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; background: #13235B; color: #FFFFFF; font-weight: 600\">Network Quality<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Mobile Plans<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Pricing &amp; Promotions<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Devices<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Customer Service<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">App &amp; Account<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Billing &amp; Payment<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Roaming<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Porting<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px dashed #6B7285; color: #4A5163; font-weight: 600\">General Discussion<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"Recommendations\" style=\"display: flex; flex-direction: column; gap: 28px\">\n<h2 class=\"sh\" style=\"border-bottom: none; padding-bottom: 0\"><span>07<\u002Fspan>What operators should do (RQ4), ordered by share of not-happy talk<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Network<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Status page and restoration ETAs during incidents; join 289 location-naming complaints to tickets and cell data.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Plans and pricing<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Show fair-use limits, add-on charges, recurring price and host network at checkout.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Devices and app<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Publish router and eSIM requirements per plan; watch forums after every app release.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Service and billing<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Publish the compensation rule with the outage notice; keep self-service open during incidents.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #8B6B12\">Deploy<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">GPT-4o-mini for sentiment, rules plus targeted GPT-4o for issues, a person reviewing every alert.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<!-- FOOTER -->\n<footer style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 80px; padding-top: 28px; border-top: 4px solid #13235B\">\n<p class=\"cap\" style=\"font-size: 25px; color: #2A3042\"><b style=\"color: #13235B\">Limitations.<\u002Fb> Forum users are self-selected; results are triage signals, not market sentiment. One annotator labels the benchmark, and humans agree only fairly on typical posts (κ 0.39). The hybrid's 0.639 is optimistic: it was chosen after seeing part of the representative set. Next: adjudicate A–B disagreements, add target-aware (per-brand) sentiment, and validate alerts against internal tickets.<\u002Fp>\n<p class=\"cap\" style=\"font-size: 23px\"><b style=\"color: #13235B\">References.<\u002Fb> Hutto &amp; Gilbert (2014) VADER, ICWSM. OpenAI (2024) GPT-4o System Card, arXiv:2410.21276. Cohen (1960); Landis &amp; Koch (1977) Biometrics 33(1). Efron &amp; Tibshirani (1993) An Introduction to the Bootstrap. Heitmann, Arctic Shift Reddit archive. Models: gpt-4o-mini-2024-07-18, gpt-4o-2024-08-06.<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"width: 3179px; height: 4494px; box-sizing: border-box; padding: 110px 120px 90px; background: #FFFFFF; display: flex; flex-direction: column; gap: 56px; font-family: 'Source Sans 3', 'Segoe UI', sans-serif; color: #1B1F2A; overflow: hidden\" data-canvas-width=\"3179\" data-canvas-height=\"4494\" data-document-role=\"page\" data-label=\"A0 poster (portrait)\">\n\n\n<header style=\"display: flex; align-items: center; gap: 90px; padding-bottom: 44px; border-bottom: 10px solid #C8A13A\">\n<img src=\"b3722acb-3337-4aca-a866-e751b68102ee\" alt=\"Singapore Management University, School of Computing and Information Systems\" style=\"height: 300px; width: auto; flex-shrink: 0\">\n<div style=\"display: flex; flex-direction: column; gap: 22px; flex: 1; min-width: 0\">\n<div style=\"font-size: 32px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #8B6B12\">MSc in Information Systems · Capstone Project · Data Science &amp; Data Analytics<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 150px; line-height: 1.02; font-weight: 700; color: #13235B; letter-spacing: -2px\">From Forum Posts to Telco Actions<\u002Fh1>\n<div style=\"font-size: 54px; line-height: 1.25; color: #2A3042; text-wrap: balance\">An end-to-end pipeline for sentiment and issue analysis of Singapore telecommunications discussions, with LLMs tested against blind human labels<\u002Fdiv>\n<div style=\"font-size: 36px; color: #2A3042\"><b style=\"color: #13235B\">Liao Zixin<\u002Fb>   ·   Supervisor: Kyong Jin SHIM   ·   School of Computing and Information Systems, Singapore Management University   ·   October 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n\n<section aria-label=\"Key numbers\" style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: #13235B; color: #FFFFFF; border-radius: 20px; padding: 48px 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">9,162<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">unique posts in 349 telco threads (Reddit + HardwareZone, to 26 Sep 2026)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">44%<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">of posts are not happy (GPT-4o-mini); VADER calls 46% happy<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">0.641 <span style=\"font-size: 52px; color: #B9C2E0\">vs 0.380<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">sentiment macro F1, GPT-4o-mini vs VADER on 392 blind human labels<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px; border-right: 2px solid #3A4A85\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">0.639 <span style=\"font-size: 52px; color: #B9C2E0\">vs 0.590<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">issue macro F1, rules + GPT-4o on unresolved posts vs rules alone<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 0 40px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 104px; font-weight: 700; line-height: 1\">$6.35<\u002Fdiv>\n<div style=\"font-size: 32px; line-height: 1.3; color: #DDE2F2\">total OpenAI billing, 1 Sep–22 Oct 2026: $5.34 for reported results, $1.01 for a discarded run and tests<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<div style=\"flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 100px\">\n\n\n<div style=\"display: flex; flex-direction: column; gap: 40px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>01<\u002Fspan>Why forums, and what we asked<\u002Fh2>\n<p class=\"p\">Singapore mobile customers argue about coverage, plan terms, outages and support on Reddit and HardwareZone (HWZ) every day. The feedback is early but informal, Singlish-heavy and repetitive: too much to read by hand, and often misread by a sentiment lexicon.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ1<\u002Fb><p class=\"p\">Which sentiment and issue themes appear most frequently in the collected Singapore telco discussions?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ2<\u002Fb><p class=\"p\">How do discussion patterns differ between Reddit and HWZ, and across telco brands?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ3<\u002Fb><p class=\"p\">What do GPT-4o-mini and GPT-4o add over VADER sentiment and keyword-based issue rules?<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 22px; align-items: baseline\"><b style=\"font-size: 32px; color: #8B6B12; flex-shrink: 0; width: 82px\">RQ4<\u002Fb><p class=\"p\">How can the extracted signals support concrete decisions by telco operators?<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>02<\u002Fspan>Data: most rows were duplicates<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; gap: 24px; background: #E9ECF4; border-radius: 14px; padding: 20px 28px; width: 100%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; color: #13235B; width: 230px; flex-shrink: 0\">24,690<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">scraped rows after preprocessing<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px; background: #D3D9EA; border-radius: 14px; padding: 20px 28px; width: 86%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; color: #13235B; width: 230px; flex-shrink: 0\">11,643<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">unique posts (repeat scrape rounds re-saved the same comments)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px; background: #13235B; color: #FFFFFF; border-radius: 14px; padding: 20px 28px; width: 72%; box-sizing: border-box\">\n<div class=\"num\" style=\"font-size: 52px; font-weight: 800; width: 230px; flex-shrink: 0\">9,162<\u002Fdiv>\n<div style=\"font-size: 30px; line-height: 1.3\">posts in 349 telco threads; 96 off-topic threads dropped<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">5,711 Reddit and 3,451 HWZ posts; Reddit after 9 Apr 2026 from the Arctic Shift archive. Shares are reported per post and thread-weighted.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>03<\u002Fspan>Pipeline<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">1<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Collect<\u002Fb> · Reddit and HWZ (XenForo) scrapers, brand-keyword matched<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">2<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Preprocess<\u002Fb> · one schema; drop empty, placeholder and short rows<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">3<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Brand detection<\u002Fb> · regex for Singtel, StarHub, M1, SIMBA, Giga, Eight, Zym, redONE; ambiguous names need a telco word nearby<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">4<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #13235B; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Sentiment<\u002Fb> · GPT-4o-mini, temperature 0, JSON, batches of 10 (VADER kept as baseline)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">5<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #13235B; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Issues<\u002Fb> · keyword taxonomy first; GPT-4o only on rows rules left as general discussion<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #13235B; color: #FFFFFF; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">6<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Clean corpus<\u002Fb> · dedupe by post ID; keep threads where ≥20% of posts name a telco<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 24px; align-items: center\">\n<div style=\"width: 64px; height: 64px; border-radius: 50%; background: #C8A13A; color: #13235B; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">7<\u002Fdiv>\n<div style=\"flex: 1; border: 3px solid #C3CADB; border-radius: 14px; padding: 9px 22px; font-size: 29px; line-height: 1.32\"><b>Dashboard<\u002Fb> · static HTML page with a weekly huddle queue<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-left: 88px; border: 3px dashed #8B6B12; border-radius: 14px; padding: 16px 24px; font-size: 28px; line-height: 1.35; color: #3A3220; background: #FBF6E8\">Evaluation branch: blind human gold labels score steps 4 and 5. They check the labels and never feed back into the data.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-direction: column; gap: 44px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>04<\u002Fspan>Evaluation design<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 80px; font-weight: 700; color: #13235B; line-height: 1\">392<\u002Fdiv>\n<div style=\"font-size: 29px; line-height: 1.3\"><b>Representative set.<\u002Fb> Telco posts across the whole period; carries the headline metrics.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 80px; font-weight: 700; color: #13235B; line-height: 1\">100<\u002Fdiv>\n<div style=\"font-size: 29px; line-height: 1.3\"><b>Challenge set.<\u002Fb> Held-out hard posts: sarcasm, Singlish, negation, mixed brands.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">Annotators saw only the thread title and post, never a model output. Paired bootstrap (2,000 resamples) separates real gains from ties.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Sentiment macro F1<\u002Fh3>\n<div style=\"display: flex; gap: 36px; font-size: 26px; color: #4A5163; align-items: center\">\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 44px; height: 26px; background: #13235B; display: inline-block\"><\u002Fspan>Representative (n=392)<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 44px; height: 26px; border: 4px solid #13235B; box-sizing: border-box; display: inline-block\"><\u002Fspan>Challenge (n=100)<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">VADER<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 38%; height: 42px; background: #8A92A6; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.380<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.1%; height: 42px; border: 4px solid #8A92A6; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.491<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 61.1%; height: 42px; background: #5B78C7; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.611<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 71.2%; height: 42px; border: 4px solid #5B78C7; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.712<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 800; color: #13235B\">GPT-4o-mini<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 64.1%; height: 42px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.641<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 77.3%; height: 42px; border: 4px solid #13235B; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.773<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">GPT-4o-mini beats VADER by <b>+0.261<\u002Fb> (95% CI 0.197 to 0.324) and ties GPT-4o at about 1/17 of the cost. VADER labels 74 of 186 human complaints as happy. A rerun reproduced 292 of 295 labels (κ 0.98).<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Issue macro F1<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 26px\">\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o-mini<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.8%; height: 42px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.498<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 47%; height: 42px; border: 4px solid #13235B; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.470<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">Keyword rules<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 59%; height: 42px; background: #8A92A6; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.590<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 49.9%; height: 42px; border: 4px solid #8A92A6; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.499<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 600\">GPT-4o, all posts<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 58.5%; height: 42px; background: #5B78C7; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.585<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 59.6%; height: 42px; border: 4px solid #5B78C7; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.596<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 24px\">\n<div style=\"width: 220px; flex-shrink: 0; font-size: 30px; font-weight: 800; color: #13235B\">Hybrid: rules, then GPT-4o<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 63.9%; height: 42px; background: #C8A13A; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px; font-weight: 800\">0.639<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px\"><div style=\"width: 50.9%; height: 42px; border: 4px solid #C8A13A; box-sizing: border-box; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-size: 30px\">0.509<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">On typical posts the hybrid is the only method that beats rules (<b>+0.049<\u002Fb>, CI 0.024 to 0.074): it keeps rule hits such as Devices (GPT-4o finds 24% of device posts, rules 81%). On hard posts its gain vanishes and GPT-4o on every post wins. No issue method wins on both sets.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Human agreement sets the ceiling<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; font-size: 29px\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 3px solid #13235B; font-weight: 700; color: #13235B\"><span>Cohen's κ, sentiment<\u002Fspan><span style=\"text-align: right\">Typical<\u002Fspan><span style=\"text-align: right\">Hard<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>Annotator A vs B<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.37<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.59<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>A vs B, one disputed rule removed<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.57<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.86<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>GPT-4o-mini vs A<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.33<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.66<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid #C3CADB\"><span>GPT-4o-mini vs B<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.52<\u002Fspan><span class=\"num\" style=\"text-align: right\">0.54<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">Most disagreement is one question: is a bare failure report a complaint or neutral? The model agrees with each human about as well as they agree with each other.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-direction: column; gap: 44px; min-width: 0\">\n\n<section class=\"sec\">\n<h2 class=\"sh\"><span>05<\u002Fspan>Findings: two in five posts are unhappy<\u002Fh2>\n<div style=\"display: flex; gap: 32px; font-size: 26px; color: #4A5163; align-items: center\">\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #B4501A; display: inline-block\"><\u002Fspan>Not happy<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #D5D9E2; display: inline-block\"><\u002Fspan>Neutral<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 32px; height: 26px; background: #2F5BB7; display: inline-block\"><\u002Fspan>Happy<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 700; color: #13235B\">GPT-4o-mini, per post<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 44 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">44%<\u002Fdiv><div style=\"flex: 37 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">37%<\u002Fdiv><div style=\"flex: 19 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">19%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">GPT-4o-mini, thread-weighted<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 42 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">42%<\u002Fdiv><div style=\"flex: 40 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">40%<\u002Fdiv><div style=\"flex: 18 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">18%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">Human gold labels<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 47 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">47%<\u002Fdiv><div style=\"flex: 32 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">32%<\u002Fdiv><div style=\"flex: 21 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">21%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<div style=\"width: 250px; flex-shrink: 0; font-size: 28px; line-height: 1.2; font-weight: 600\">VADER, same posts<\u002Fdiv>\n<div style=\"flex: 1; display: flex; height: 62px; font-size: 28px; font-weight: 700\"><div style=\"flex: 28 1 0; background: #B4501A; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">28%<\u002Fdiv><div style=\"flex: 27 1 0; background: #D5D9E2; color: #1B1F2A; display: flex; align-items: center; padding-left: 14px\">27%<\u002Fdiv><div style=\"flex: 46 1 0; background: #2F5BB7; color: #FFFFFF; display: flex; align-items: center; padding-left: 14px\">46%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">VADER nearly reverses the picture. These are shares of unsolicited forum talk, not a satisfaction rate.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Issue share of posts (hybrid labels)<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 28px\">\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0; font-weight: 700; color: #13235B\">Network Quality<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 74%; height: 40px; background: #C8A13A; flex-shrink: 0\"><\u002Fdiv><span class=\"num\" style=\"font-weight: 800\">40.7%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">General Discussion<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 26.5%; height: 40px; background: #A9B0C2; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">14.6%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Mobile Plans<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 25.1%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">13.8%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Pricing &amp; Promotions<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 14.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">8.1%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Devices<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 10.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">5.9%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Customer Service<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%  ·  59% not happy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">App &amp; Account<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%  ·  in 115 threads<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Roaming<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 6.7%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">3.7%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Billing &amp; Payment<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 5.3%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">2.9%  ·  53% not happy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 20px\"><div style=\"width: 280px; flex-shrink: 0\">Porting<\u002Fdiv><div style=\"flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0\"><div style=\"width: 5.3%; height: 40px; background: #13235B; flex-shrink: 0\"><\u002Fdiv><span class=\"num\">2.9%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\">Network quality carries 46% of thread-weighted not-happy discussion. GPT-4o cut general discussion from 35% to 15% of posts.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<h3 class=\"sub\">Case study: one outage skews everything<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n<div style=\"background: #FBEDE5; border-radius: 16px; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 76px; font-weight: 700; color: #8F3C10; line-height: 1\">71% <span style=\"font-size: 40px; color: #4A5163\">vs 40%<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 28px; line-height: 1.3\">not happy inside the 45 outage threads (12% of posts) vs all others<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #E9ECF4; border-radius: 16px; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px\">\n<div class=\"num\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 76px; font-weight: 700; color: #13235B; line-height: 1\">1,099<span style=\"font-size: 40px; color: #4A5163\">/1,102<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 28px; line-height: 1.3\">outage posts are on Reddit, so the Reddit–HWZ gap shrinks from 48/37% to 42/37%<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"p\">Led by the 16 March 2026 Singtel outage. Outside outage threads, Singtel, StarHub, SIMBA, M1 and Giga sit at 40–43% not happy; Eight is lowest (31–35%) under every weighting. No brand league table is defensible.<\u002Fp>\n<p class=\"p\">The weekly huddle alert (2× the 26-week median, 115 posts) fired twice: the Singtel outage week (352) and 14 Sep 2026 (149), a multi-brand week of StarHub broadband and SIMBA app OTP failures.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-direction: column; gap: 32px; background: #F3F4F8; border-radius: 20px; padding: 40px 52px\">\n<section aria-label=\"Issue taxonomy\" style=\"display: flex; align-items: center; gap: 48px; padding-bottom: 32px; border-bottom: 3px solid #C3CADB\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; width: 620px; flex-shrink: 0\">\n<h2 class=\"sh\" style=\"border-bottom: none; padding-bottom: 0\"><span>06<\u002Fspan>Issue taxonomy<\u002Fh2>\n<p class=\"cap\">Ten labels, multi-label per post; each routes to an owning team.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px\">\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; background: #13235B; color: #FFFFFF; font-weight: 600\">Network Quality<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Mobile Plans<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Pricing &amp; Promotions<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Devices<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Customer Service<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">App &amp; Account<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Billing &amp; Payment<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Roaming<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px solid #13235B; color: #13235B; font-weight: 600\">Porting<\u002Fspan>\n<span style=\"font-size: 28px; padding: 10px 24px; border-radius: 40px; border: 3px dashed #6B7285; color: #4A5163; font-weight: 600\">General Discussion<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"Recommendations\" style=\"display: flex; flex-direction: column; gap: 28px\">\n<h2 class=\"sh\" style=\"border-bottom: none; padding-bottom: 0\"><span>07<\u002Fspan>What operators should do (RQ4), ordered by share of not-happy talk<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Network<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Status page and restoration ETAs during incidents; join 289 location-naming complaints to tickets and cell data.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Plans and pricing<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Show fair-use limits, add-on charges, recurring price and host network at checkout.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Devices and app<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Publish router and eSIM requirements per plan; watch forums after every app release.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #13235B\">Service and billing<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">Publish the compensation rule with the outage notice; keep self-service open during incidents.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 32px; font-weight: 800; color: #8B6B12\">Deploy<\u002Fdiv>\n<p class=\"p\" style=\"font-size: 29px\">GPT-4o-mini for sentiment, rules plus targeted GPT-4o for issues, a person reviewing every alert.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n\n<footer style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 80px; padding-top: 28px; border-top: 4px solid #13235B\">\n<p class=\"cap\" style=\"font-size: 25px; color: #2A3042\"><b style=\"color: #13235B\">Limitations.<\u002Fb> Forum users are self-selected; results are triage signals, not market sentiment. One annotator labels the benchmark, and humans agree only fairly on typical posts (κ 0.39). The hybrid's 0.639 is optimistic: it was chosen after seeing part of the representative set. Next: adjudicate A–B disagreements, add target-aware (per-brand) sentiment, and validate alerts against internal tickets.<\u002Fp>\n<p class=\"cap\" style=\"font-size: 23px\"><b style=\"color: #13235B\">References.<\u002Fb> Hutto &amp; Gilbert (2014) VADER, ICWSM. OpenAI (2024) GPT-4o System Card, arXiv:2410.21276. Cohen (1960); Landis &amp; Koch (1977) Biometrics 33(1). Efron &amp; Tibshirani (1993) An Introduction to the Bootstrap. Heitmann, Arctic Shift Reddit archive. Models: gpt-4o-mini-2024-07-18, gpt-4o-2024-08-06.<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C8A13A&quot;,&quot;options&quot;:[&quot;#C8A13A&quot;,&quot;#B4501A&quot;,&quot;#2F8F6B&quot;,&quot;#5B78C7&quot;]},&quot;$preview&quot;:{&quot;width&quot;:3179,&quot;height&quot;:4494}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#C8A13A' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
